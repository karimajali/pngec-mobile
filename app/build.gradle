apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'com.google.gms.google-services'
// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'


android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
    defaultConfig {
        applicationId "com.pngelectoral"
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 21
        versionName "2026.6.02"
        flavorDimensions "default"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    productFlavors {
        dev {
            archivesBaseName = "PNGEC" + "$defaultConfig.versionName" + "($defaultConfig.versionCode)_" + getDate()
            dimension 'default'
            buildConfigField "String", "BASE_URL", "\"http://192.168.1.20:57712/api/mobile/\""
        }

        training {
            archivesBaseName = "PNGEC" + "$defaultConfig.versionName" + "($defaultConfig.versionCode)_" + getDate()
            dimension 'default'
            buildConfigField "String", "BASE_URL", "\"http://192.168.1.20:57712/api/mobile/\""
        }


        production {
            archivesBaseName = "PNGEC" + "$defaultConfig.versionName" + "($defaultConfig.versionCode)_" + getDate()
            dimension 'default'
            buildConfigField "String", "BASE_URL", "\"http://192.168.1.20:57712/api/mobile/\""
        }
    }

    buildTypes {
        debug {
            multiDexEnabled true
        }
        release {
            signingConfig signingConfigs.debug
            multiDexEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    dataBinding
            {
                enabled true
            }

}

static def getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyy_MM_dd')
    return formattedDate
}

repositories {
    // Depending on AndroidX Snapshot Builds to get the latest CameraX libs.
    maven { url 'https://androidx.dev/snapshots/builds/6787662/artifacts/repository/' }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    //material design
    implementation 'com.google.android.material:material:1.4.0'
    //viewmodel
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    //Anko(alert library)
    implementation "org.jetbrains.anko:anko:0.10.8"
    // Rxjava retrofit and okhttp
    implementation 'com.squareup.retrofit2:retrofit:2.6.1'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.4.0'
//    implementation 'com.hb.retroapi:retroapi:1.1.1'
    implementation 'com.github.hbdevmdm:RetroAPI:1.8'
    //multidex
    implementation 'com.android.support:multidex:1.0.3'
    //Glide
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    api 'com.wang.avi:library:2.1.3'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    /* Circle Image */
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //room
    implementation "android.arch.persistence.room:runtime:1.1.1"
    kapt "android.arch.persistence.room:compiler:1.1.1"
    testImplementation "android.arch.persistence.room:testing:1.1.1"
    // Rx Dependencies
    implementation "io.reactivex.rxjava2:rxjava:2.1.16"
    implementation "io.reactivex.rxjava2:rxandroid:2.0.2"
    implementation "io.reactivex.rxjava2:rxkotlin:2.2.0"
    // google mobile vision
    implementation 'com.google.android.gms:play-services-vision:20.1.1'
    //permissions
    implementation 'com.karumi:dexter:6.0.2'
    /*Permission*/
    //PermissionHelper
    api 'com.master.android:permissionhelper:2.0'
    //image crop
    //implementation 'com.theartofdev.edmodo:android-image-cropper:2.8.+'
    //Location
    api 'com.google.android.gms:play-services-location:17.1.0'
    implementation platform('com.google.firebase:firebase-bom:26.1.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'
    // WorkManager for background sync (Phase 1)
    implementation "androidx.work:work-runtime-ktx:2.7.1"
    compile(
            [group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.10.4'],
            [group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.10.4'],
            [group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.10.4']
    )
    kapt "com.android.databinding:compiler:3.2.0-alpha10"
    implementation 'com.journeyapps:zxing-android-embedded:3.6.0'
    implementation 'com.itextpdf:itext7-core:7.1.11'
    // Face features
    implementation 'com.google.mlkit:face-detection:16.1.2'
    implementation 'com.google.mlkit:camera:16.0.0-beta1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.guava:guava:27.1-android'
    // CameraX
    implementation "androidx.camera:camera-camera2:1.0.0-SNAPSHOT"
    implementation "androidx.camera:camera-lifecycle:1.0.0-SNAPSHOT"
    implementation "androidx.camera:camera-view:1.0.0-SNAPSHOT"
    // On Device Machine Learnings
    implementation "com.google.android.odml:image:1.0.0-beta1"
    implementation 'com.googlecode.json-simple:json-simple:1.1'
    implementation('com.github.pankaj89:SampleDIProject:1.0.6') {
        exclude group: "com.github.pankaj89", module: "SimpleAdapter"
    }

    //Fetch Api for Downloading PDF
    implementation "com.tonyodev.fetch2:fetch2:3.0.12"
    implementation('com.tonyodev.fetch2okhttp:fetch2okhttp:3.0.12') {
        exclude group: 'com.tonyodev.fetch2okhttp', module: 'fetch2core'
    }
}

configurations {
    // Resolves dependency conflict caused by some dependencies use
    // com.google.guava:guava and com.google.guava:listenablefuture together.
    all*.exclude group: 'com.google.guava', module: 'listenablefuture'
}